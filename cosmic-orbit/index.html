<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmic Orbit - Math-Based Animation</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="sketch.js" defer></script>
</head>
<body>
<main>
<h1>Cosmic Orbit</h1>
<p>A planet orbits a star using sine, cosine, and radius.</p>
<div id="sketch-holder"></div>
<p>Controls: Move mouse left/right to change speed. SPACE = pause/resume. R = reset.</p>
<p class="formula">x = centerX + cos(angle) × radius<br>y = centerY + sin(angle) × radius</p>
<footer>
<p>IT3 Math-Based Animation in p5.js</p>
</footer>
</main>
</body></html>
